# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# Elixir/OTP come from `.tool-versions` via setup-beam's `version-file`, so CI
# and local dev resolve one toolchain and cannot silently diverge. Change the
# toolchain in that file, never here. `version-type: strict` is mandatory
# alongside `version-file` — setup-beam hard-errors without it.

name: Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Runs the canonical gate — format / compile / credo / doctor / 95%
      # coverage / sobelow / ex_dna / reach.check / mix_audit / dialyzer.json.
      # See `mix.exs` `aliases/0` (`ci` -> `precommit.full`) for the
      # authoritative step list.
      #
      # Two steps degrade on a runner and print `[skip]`: the AGENTS.md
      # freshness check and the advisory-mirror freshness proof that guards
      # `deps.audit` both shell out to scripts that live on the developer host
      # (claude-marketplace / onchain-stack checkouts). CI therefore runs
      # `mix deps.audit` WITHOUT the freshness proof; the developer host and
      # the harness reviewer are what actually gate those two.
      - name: mix ci
        run: mix ci

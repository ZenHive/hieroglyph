# ===========================================================================

[[task]]
id = 1
phase = 1
bundle = "bugs"
status = "done"
title = "Indexed reference-type event parameters decoded wrong (upstream #53)"
markers = ["bug"]
scores = { d = 4, b = 7, u = 6 }
done_at = "2026-04-24"
shipped_in = "1.0.0"
body = "lib/abi/event.ex:146-172 decoded indexed reference-type event params incorrectly. Indexed complex types are stored as keccak256 hashes in topics, not as their plain encoding."
implemented = "Indexed reference-type params (all arrays — fixed or dynamic — plus tuples, string, bytes) now return {:indexed_hash, <<32 bytes>>} via a local reference_type?/1 predicate matching the Solidity spec's 'all complex types' event-indexing rule (broader than FunctionSelector.dynamic?/1's head/tail rule). Static value-type indexed params unchanged. Filed upstream as #53; awaiting maintainer response."

[[task]]
id = 2
phase = 1
bundle = "bugs"
status = "done"
title = "fixed/ufixed/function parse but cannot encode + typespec gaps (upstream #54)"
markers = ["bug"]
scores = { d = 3, b = 6, u = 6 }
done_at = "2026-04-24"
shipped_in = "1.0.0"
body = "lib/abi/parser.ex and function_selector.ex: fixed/ufixed/function types parsed but had no encoder, and @type type was missing {:bytes, N}."
implemented = "Parse-time rejection of :function, {:fixed, M, N}, {:ufixed, M, N} (incl. nested in arrays/tuples) with an ArgumentError linking upstream #54; {:bytes, pos_integer()} added to @type type. NOTE: the :function rejection was later lifted in 1.3.0 (see task 33). fixed/ufixed stay rejected per Solidity's own incomplete support. Awaiting upstream response."

[[task]]
id = 3
phase = 1
bundle = "bugs"
status = "done"
title = "Lexer 'x' terminal shadowed by LETTERS rule (sub-bug of #54)"
markers = ["bug"]
scores = { d = 4, b = 4, u = 4 }
done_at = "2026-05-01"
shipped_in = "1.2.0"
body = "src/ethereum_abi_lexer.xrl / ethereum_abi_parser.yrl: a single 'x' (the separator in fixedMxN) was shadowed by the {LETTERS} rule, so the explicit-M/N fixed forms never lexed correctly."
implemented = "Dedicated fixed_typename / ufixed_typename lexer terminals so 'x' only separates in fixed/ufixed contexts; 'x' rule moved before {LETTERS} so single 'x' lexes as the terminal; parser gains identifier_part -> 'x' | fixed_typename | ufixed_typename so single-char 'x' and keyword forms still work as names. Explicit M/N forms route through reject_unsupported!/1 with the #54 ArgumentError. Shift/reduce count 1 → 3 (new conflicts resolve as shift, desired; documented inline). Upstream filing deferred to a future batched issue."

[[task]]
id = 4
phase = 1
bundle = "bugs"
status = "done"
title = "dynamic?/1 crashes on zero-length fixed array"
markers = ["bug"]
scores = { d = 1, b = 4, u = 4 }
done_at = "2026-05-01"
shipped_in = "1.1.0"
body = "lib/abi/function_selector.ex:484: dynamic?/1 had no clause for {:array, _type, 0} and crashed on T[0]."
implemented = "One-line fix: def dynamic?({:array, _type, 0}), do: false. Encoder/decoder already handled zero-length arrays correctly — verified by extending roundtrip_property_test.exs's fixed-array length domain to 0..3. Pre-existing upstream; not yet filed (candidate to fold with the lexer fix into a single PR)."

[[task]]
id = 5
phase = 1
bundle = "bugs"
status = "done"
title = "encode_int/2 byte-vs-bit overflow guard rejected ALL int<N> (upstream #55)"
markers = ["bug"]
scores = { d = 3, b = 7, u = 6 }
done_at = "2026-05-01"
shipped_in = "1.1.0"
body = "lib/abi/type_encoder.ex:382-401: the overflow guard compared byte_size(significant_bytes) against desired_size_bytes - 1 (= 0 for int8), so even encoding 0 raised; most non-trivial int16/int32 values failed too."
implemented = "Replaced the byte-vs-bit guard with an up-front numeric range check against 2^(N-1), so the encoder accepts the full signed range -2^(N-1)..2^(N-1)-1 for every int<N>. The pre-existing 'int overflow raises data overflow' test passed only because the encoder was broken for all values; tightened to assert in-range values encode AND boundary cases (128, -129) raise. Surfaced by the round-trip property suite on first run. Filed upstream #55; awaiting response."

[[task]]
id = 6
phase = 1
bundle = "bugs"
status = "done"
title = ":string decode silently truncated at first NUL byte"
markers = ["bug"]
scores = { d = 2, b = 6, u = 6 }
done_at = "2026-05-01"
shipped_in = "1.2.0"
body = "lib/abi/type_decoder.ex:295-298: the :string decode clause split the decoded binary at the first <<0>> via nul_terminate_string/1, treating Solidity strings as C strings. Solidity strings are length-prefixed UTF-8 and may legally contain NUL codepoints. Affects ABI.decode/3, decode_call/3, decode_event/4, TypeDecoder.decode/3."
implemented = "Removed the nul_terminate_string/1 helper entirely; :string decode now delegates straight to decode_bytes(rest, length, :right) (Math.unpad already returns the right length). Surfaced by the mixed-element tuple[] property (task 28). Pre-existing upstream since 2018 (bdceb719). Three regression tests added (leading/embedded/all-NUL). Upstream filing pending — batch with the lexer x sub-bug."

